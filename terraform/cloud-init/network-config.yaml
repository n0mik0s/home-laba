# cloud-init/network-config-static.yaml
# Static IP configuration example
version: 2
ethernets:
  ens3:
    dhcp4: false
    dhcp6: false
    addresses:
      - 192.168.0.100/24
    routes:
      - to: default
        via: 192.168.0.1
    nameservers:
      addresses:
        - 8.8.8.8
        - 1.1.1.1
      search:
        - personal.internal
        - local