[defaults]
inventory           = inventory/terraform.py
remote_user         = ops
host_key_checking   = True
retry_files_enabled = False
# host_group_vars is the built-in plugin that loads plain group_vars/host_vars;
# community.sops.sops transparently decrypts *.sops.yaml files in those same
# directories (sops binary path + age key file come from the environment —
# ANSIBLE_SOPS_BINARY / SOPS_AGE_KEY_FILE, see confidential/.env).
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
